name: DKMS Build Test

on:
  push:
    branches: [main]
    paths:
      - 'dkms/**'
      - '.github/workflows/dkms-build-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dkms/**'
      - '.github/workflows/dkms-build-test.yml'
  workflow_dispatch:

jobs:
  # Syntax and structure validation - the reliable test
  validate-dkms-config:
    name: Validate DKMS Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate dkms.conf syntax
        run: |
          echo "Checking dkms.conf..."
          if [ ! -f dkms/dkms.conf ]; then
            echo "ERROR: dkms/dkms.conf not found"
            exit 1
          fi

          if ! bash -n dkms/dkms.conf; then
            echo "ERROR: dkms.conf has syntax errors"
            exit 1
          fi
          echo "dkms.conf syntax OK"

          MISSING=0
          for field in PACKAGE_NAME PACKAGE_VERSION BUILT_MODULE_NAME; do
            if grep -q "$field" dkms/dkms.conf; then
              echo "  $field: found"
            else
              echo "  $field: MISSING"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "ERROR: Missing required dkms.conf fields"
            exit 1
          fi

      - name: Validate Makefile
        run: |
          echo "Checking Makefile..."
          if [ ! -f dkms/src/Makefile ]; then
            echo "ERROR: dkms/src/Makefile not found"
            exit 1
          fi

          for target in "^all:" "^clean:"; do
            if grep -q "$target" dkms/src/Makefile; then
              echo "  $target target found"
            else
              echo "ERROR: $target target missing"
              exit 1
            fi
          done

          if ! grep -q "obj-m" dkms/src/Makefile; then
            echo "ERROR: No obj-m module definitions found"
            exit 1
          fi
          echo "Makefile validation OK"

      - name: Check required source files
        run: |
          REQUIRED_FILES=(
            "dkms/src/mt76.h"
            "dkms/src/mt792x.h"
            "dkms/src/mt7925/mt7925.h"
            "dkms/src/mt7925/main.c"
            "dkms/src/mt7925/mcu.c"
            "dkms/src/mt7925/mac.c"
            "dkms/src/mt7925/pci.c"
          )

          MISSING=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ -f "$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "ERROR: $MISSING required files missing"
            exit 1
          fi

      - name: Check install scripts syntax
        run: |
          for script in dkms/install.sh dkms/uninstall.sh; do
            if [ -f "$script" ]; then
              if ! bash -n "$script"; then
                echo "ERROR: $script has syntax errors"
                exit 1
              fi
              echo "$script: syntax OK"
            fi
          done

  # Build test with recent kernel headers
  # Uses newest distro versions to get kernel 6.12+ headers
  build-dkms:
    name: DKMS Build - ${{ matrix.distro.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          # Ubuntu 25.10 has kernel 6.17 headers
          - name: "Ubuntu 25.10"
            image: "ubuntu:25.10"
            install_deps: |
              apt-get update
              apt-get install -y build-essential linux-headers-generic
            kernel_headers: "/usr/src/linux-headers-*-generic"
          # Fedora 42 has recent kernel headers
          - name: "Fedora 42"
            image: "fedora:42"
            install_deps: |
              dnf install -y kernel-devel gcc make
            kernel_headers: "/usr/src/kernels/*"
          # Arch Linux rolling has the newest
          - name: "Arch Linux"
            image: "archlinux:latest"
            install_deps: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm base-devel linux-headers
            kernel_headers: "/usr/lib/modules/*/build"

    container:
      image: ${{ matrix.distro.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          INSTALL_SCRIPT: ${{ matrix.distro.install_deps }}
        run: |
          eval "$INSTALL_SCRIPT"

      - name: Find kernel headers
        id: headers
        env:
          HEADER_PATTERN: ${{ matrix.distro.kernel_headers }}
        run: |
          KDIR=$(ls -d $HEADER_PATTERN 2>/dev/null | sort -V | tail -1 || echo "")
          if [ -z "$KDIR" ] || [ ! -d "$KDIR" ]; then
            echo "No kernel headers found"
            find /usr/src -maxdepth 2 -type d -name "linux-*" 2>/dev/null || true
            find /usr/lib/modules -maxdepth 2 -type d -name "build" 2>/dev/null || true
            echo "headers_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "Found kernel headers: $KDIR"

          # Extract kernel version
          KVER=$(basename "$KDIR" | sed 's/linux-headers-//' | sed 's/build//' || echo "unknown")
          echo "Kernel version: $KVER"

          echo "kdir=$KDIR" >> $GITHUB_OUTPUT
          echo "headers_found=true" >> $GITHUB_OUTPUT

      - name: Build DKMS modules
        if: steps.headers.outputs.headers_found == 'true'
        env:
          KDIR: ${{ steps.headers.outputs.kdir }}
        run: |
          cd dkms/src
          echo "Building against kernel headers: $KDIR"
          make KDIR="$KDIR" clean || true
          make KDIR="$KDIR" -j$(nproc)

      - name: Verify built modules
        if: steps.headers.outputs.headers_found == 'true'
        run: |
          cd dkms/src
          echo "Checking for built modules..."

          EXPECTED="mt76.ko mt76-connac-lib.ko mt792x-lib.ko mt7925-common.ko mt7925e.ko"
          MISSING=0

          for mod in $EXPECTED; do
            if [ -f "$mod" ]; then
              SIZE=$(ls -lh "$mod" | awk '{print $5}')
              echo "  OK: $mod ($SIZE)"
            else
              echo "  MISSING: $mod"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "ERROR: $MISSING modules failed to build"
            exit 1
          fi

          echo ""
          echo "All 5 modules built successfully!"
