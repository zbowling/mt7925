name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'dkms/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v prefix, e.g., 1.4.0)'
        required: true
        type: string

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag or input
        id: version
        env:
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/tags/v* ]]; then
            echo "VERSION=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            # For PRs and branch pushes, use version from dkms.conf
            VERSION=$(grep -oP 'PACKAGE_VERSION="\K[^"]+' dkms/dkms.conf)
            echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Using version from dkms.conf: ${VERSION}"
          fi

      - name: Create source tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist
          # Create tarball with proper structure (LICENSE inside package dir)
          tar -czvf "dist/mt76-mt7925-dkms-${VERSION}.tar.gz" \
            --transform "s,^dkms/,mt76-mt7925-dkms-${VERSION}/," \
            --transform "s,^LICENSE,mt76-mt7925-dkms-${VERSION}/LICENSE," \
            --exclude='*.o' --exclude='*.ko' --exclude='*.mod*' \
            --exclude='.*.cmd' --exclude='Module.symvers' \
            --exclude='modules.order' --exclude='.cache' \
            dkms/src dkms/dkms.conf dkms/README.md LICENSE

      # Build DEB package using proper Debian packaging
      - name: Build DEB
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Install Debian packaging tools
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debhelper dh-dkms dpkg-dev fakeroot build-essential dkms

          # Update changelog version if needed
          cd dkms
          if ! grep -q "(${VERSION}-1)" debian/changelog; then
            sed -i "1s/([^)]*)/($VERSION-1)/" debian/changelog
          fi

          # Build the package
          dpkg-buildpackage -us -uc -b

          # Move built package to dist
          cd ..
          mv *.deb dist/ || { echo "Error: No DEB package found"; exit 1; }

      # Build RPM package using rpmbuild directly
      - name: Build RPM
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sudo apt-get update && sudo apt-get install -y rpm

          # Set up rpmbuild directories
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Copy source tarball
          cp "dist/mt76-mt7925-dkms-${VERSION}.tar.gz" ~/rpmbuild/SOURCES/

          # Update spec file version and copy
          sed "s/^%define version.*/%define version ${VERSION}/" dkms/mt76-mt7925-dkms.spec > ~/rpmbuild/SPECS/mt76-mt7925-dkms.spec

          # Build the RPM
          rpmbuild -bb ~/rpmbuild/SPECS/mt76-mt7925-dkms.spec

          # Move built RPM to dist
          if compgen -G ~/rpmbuild/RPMS/noarch/*.rpm >/dev/null; then
            mv ~/rpmbuild/RPMS/noarch/*.rpm dist/
          else
            echo "Warning: No RPM package found" >&2
          fi

      # Build Arch package using Docker container
      - name: Build Arch Package
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Copy tarball to dkms directory
          cp "dist/mt76-mt7925-dkms-${VERSION}.tar.gz" dkms/

          # Calculate checksum
          CHECKSUM=$(sha256sum "dkms/mt76-mt7925-dkms-${VERSION}.tar.gz" | cut -d' ' -f1)

          # Update PKGBUILD to use local file, correct version, and real checksum
          sed -i "s|^pkgver=.*|pkgver=${VERSION}|" dkms/PKGBUILD
          sed -i "s|^source=.*|source=(\"mt76-mt7925-dkms-${VERSION}.tar.gz\")|" dkms/PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('${CHECKSUM}')|" dkms/PKGBUILD

          # Build in Arch Linux container
          mkdir -p dist
          docker run --rm \
            -v "$PWD/dkms:/build" \
            -v "$PWD/dist:/dist" \
            -w /build archlinux:latest bash -c '
            # Install base-devel and runtime deps (makepkg needs sudo for deps)
            pacman -Syu --noconfirm base-devel dkms linux-firmware

            # Create build user with passwordless sudo
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            chown -R builder:builder /build

            # Build package (deps already installed, so -s is a no-op)
            su builder -c "makepkg --noconfirm"

            # Copy built package to dist (as root, so host can access it)
            cp /build/*.pkg.tar.zst /dist/
          '

          # Verify package was built
          if compgen -G 'dist/*.pkg.tar.zst' >/dev/null; then
            echo "Arch package built successfully"
          else
            echo "Warning: No Arch package found" >&2
          fi

          # Fix permissions changed by Docker before restoring PKGBUILD
          sudo chown -R "$(id -u):$(id -g)" dkms/ || true

          # Restore PKGBUILD for AUR (uses remote URL)
          git checkout dkms/PKGBUILD

      - name: List built packages
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  release:
    needs: build-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD with release version and checksum
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Download the release tarball and calculate checksum
          TARBALL_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/mt76-mt7925-dkms-${VERSION}.tar.gz"

          # Use -f to fail on HTTP errors, --retry for transient failures
          if ! curl -fSL --retry 3 --retry-delay 5 "$TARBALL_URL" -o /tmp/release.tar.gz; then
            echo "Error: Failed to download release tarball" >&2
            exit 1
          fi

          CHECKSUM=$(sha256sum /tmp/release.tar.gz | cut -d' ' -f1)

          # Verify checksum looks valid (64 hex chars)
          if [[ ! "$CHECKSUM" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Error: Invalid checksum computed: $CHECKSUM" >&2
            exit 1
          fi

          # Update PKGBUILD with version, source URL, and checksum
          sed -i "s|^pkgver=.*|pkgver=${VERSION}|" dkms/PKGBUILD
          sed -i "s|^source=.*|source=(\"https://github.com/${{ github.repository }}/releases/download/v\${pkgver}/\${pkgname}-\${pkgver}.tar.gz\")|" dkms/PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('${CHECKSUM}')|" dkms/PKGBUILD

          echo "Updated PKGBUILD:"
          echo "  pkgver=${VERSION}"
          echo "  checksum=${CHECKSUM}"

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: mt76-mt7925-dkms
          pkgbuild: dkms/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
