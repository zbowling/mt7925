name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        env:
          REF: ${{ github.ref }}
        run: echo "VERSION=${REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create source tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist
          tar -czvf "dist/mt76-mt7925-dkms-${VERSION}.tar.gz" \
            --transform "s,^dkms/,mt76-mt7925-dkms-${VERSION}/," \
            --exclude='*.o' --exclude='*.ko' --exclude='*.mod*' \
            --exclude='.*.cmd' --exclude='Module.symvers' \
            --exclude='modules.order' --exclude='.cache' \
            dkms/src dkms/dkms.conf dkms/README.md LICENSE

      # Build DEB package
      - name: Build DEB
        uses: jiro4989/build-deb-action@v3
        with:
          package: mt76-mt7925-dkms
          package_root: dkms
          maintainer: "Zac Bowling <zac@zacbowling.com>"
          version: ${{ steps.version.outputs.VERSION }}
          arch: all
          depends: dkms, linux-firmware
          desc: "MediaTek MT7925/MT7921 WiFi driver with MLO fixes (DKMS)"

      - name: Move DEB
        run: mv *.deb dist/

      # Build RPM package
      - name: Build RPM
        uses: jiro4989/build-rpm-action@v2
        with:
          spec_file: dkms/mt76-mt7925-dkms.spec

      - name: Move RPM
        run: mv *.rpm dist/ 2>/dev/null || true

      # Build Arch package
      - name: Build Arch Package
        uses: FFY00/build-arch-package@v1
        with:
          PKGBUILD: dkms/PKGBUILD

      - name: Move Arch Package
        run: mv *.pkg.tar.zst dist/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  release:
    needs: build-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: mt76-mt7925-dkms
          pkgbuild: dkms/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
