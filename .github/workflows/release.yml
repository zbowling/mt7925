name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'dkms/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v prefix, e.g., 1.4.0)'
        required: true
        type: string

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag or input
        id: version
        env:
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/tags/v* ]]; then
            echo "VERSION=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            # For PRs and branch pushes, use version from dkms.conf
            VERSION=$(grep -oP 'PACKAGE_VERSION="\K[^"]+' dkms/dkms.conf)
            echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Using version from dkms.conf: ${VERSION}"
          fi

      - name: Create source tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist
          # Create tarball with proper structure (LICENSE inside package dir)
          tar -czvf "dist/mt76-mt7925-dkms-${VERSION}.tar.gz" \
            --transform "s,^dkms/,mt76-mt7925-dkms-${VERSION}/," \
            --transform "s,^LICENSE,mt76-mt7925-dkms-${VERSION}/LICENSE," \
            --exclude='*.o' --exclude='*.ko' --exclude='*.mod*' \
            --exclude='.*.cmd' --exclude='Module.symvers' \
            --exclude='modules.order' --exclude='.cache' \
            dkms/src dkms/dkms.conf dkms/README.md LICENSE

      # Build DEB package
      - name: Build DEB
        uses: jiro4989/build-deb-action@v3
        with:
          package: mt76-mt7925-dkms
          package_root: dkms
          maintainer: "Zac Bowling <zac@zacbowling.com>"
          version: ${{ steps.version.outputs.VERSION }}
          arch: all
          depends: dkms, linux-firmware
          desc: "MediaTek MT7925/MT7921 WiFi driver with MLO fixes (DKMS)"

      - name: Move DEB
        run: |
          if compgen -G './*.deb' >/dev/null; then
            mv ./*.deb dist/
          else
            echo "Error: No DEB package found" >&2
            exit 1
          fi

      # Build RPM package using rpmbuild directly
      - name: Build RPM
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sudo apt-get update && sudo apt-get install -y rpm

          # Set up rpmbuild directories
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Copy source tarball
          cp "dist/mt76-mt7925-dkms-${VERSION}.tar.gz" ~/rpmbuild/SOURCES/

          # Update spec file version and copy
          sed "s/^%define version.*/%define version ${VERSION}/" dkms/mt76-mt7925-dkms.spec > ~/rpmbuild/SPECS/mt76-mt7925-dkms.spec

          # Build the RPM
          rpmbuild -bb ~/rpmbuild/SPECS/mt76-mt7925-dkms.spec

          # Move built RPM to dist
          if compgen -G ~/rpmbuild/RPMS/noarch/*.rpm >/dev/null; then
            mv ~/rpmbuild/RPMS/noarch/*.rpm dist/
          else
            echo "Warning: No RPM package found" >&2
          fi

      # Build Arch package using Docker container
      - name: Build Arch Package
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Copy tarball to dkms directory
          cp "dist/mt76-mt7925-dkms-${VERSION}.tar.gz" dkms/

          # Calculate checksum
          CHECKSUM=$(sha256sum "dkms/mt76-mt7925-dkms-${VERSION}.tar.gz" | cut -d' ' -f1)

          # Update PKGBUILD to use local file and real checksum
          sed -i "s|^source=.*|source=(\"mt76-mt7925-dkms-${VERSION}.tar.gz\")|" dkms/PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('${CHECKSUM}')|" dkms/PKGBUILD

          # Build in Arch Linux container
          docker run --rm -v "$PWD/dkms:/build" -w /build archlinux:latest bash -c '
            # Install base-devel and runtime deps (makepkg needs sudo for deps)
            pacman -Syu --noconfirm base-devel dkms linux-firmware

            # Create build user with passwordless sudo
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            chown -R builder:builder /build

            # Build package (deps already installed, so -s is a no-op)
            su builder -c "makepkg --noconfirm"

            # Fix permissions so host can access the built package
            chown -R '"$(id -u):$(id -g)"' /build/*.pkg.tar.zst
          '

          # Move built package
          if compgen -G 'dkms/*.pkg.tar.zst' >/dev/null; then
            mv dkms/*.pkg.tar.zst dist/
          else
            echo "Warning: No Arch package found" >&2
          fi

          # Restore PKGBUILD for AUR (uses remote URL)
          git checkout dkms/PKGBUILD

      - name: List built packages
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  release:
    needs: build-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: mt76-mt7925-dkms
          pkgbuild: dkms/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
