name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v prefix, e.g., 1.4.0)'
        required: true
        type: string

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag or input
        id: version
        env:
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/tags/v* ]]; then
            echo "VERSION=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "Error: No version provided and ref is not a tag: $REF" >&2
            exit 1
          fi

      - name: Create source tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist
          tar -czvf "dist/mt76-mt7925-dkms-${VERSION}.tar.gz" \
            --transform "s,^dkms/,mt76-mt7925-dkms-${VERSION}/," \
            --exclude='*.o' --exclude='*.ko' --exclude='*.mod*' \
            --exclude='.*.cmd' --exclude='Module.symvers' \
            --exclude='modules.order' --exclude='.cache' \
            dkms/src dkms/dkms.conf dkms/README.md LICENSE

      # Build DEB package
      - name: Build DEB
        uses: jiro4989/build-deb-action@v3
        with:
          package: mt76-mt7925-dkms
          package_root: dkms
          maintainer: "Zac Bowling <zac@zacbowling.com>"
          version: ${{ steps.version.outputs.VERSION }}
          arch: all
          depends: dkms, linux-firmware
          desc: "MediaTek MT7925/MT7921 WiFi driver with MLO fixes (DKMS)"

      - name: Move DEB
        run: |
          if compgen -G './*.deb' >/dev/null; then
            mv ./*.deb dist/
          else
            echo "Warning: No DEB package found" >&2
            exit 1
          fi

      # Build RPM package
      - name: Build RPM
        uses: jiro4989/build-rpm-action@v2
        with:
          spec_file: dkms/mt76-mt7925-dkms.spec

      - name: Move RPM
        run: |
          if compgen -G './*.rpm' >/dev/null; then
            mv ./*.rpm dist/
          else
            echo "Warning: No RPM package found" >&2
          fi

      # Build Arch package
      - name: Build Arch Package
        uses: FFY00/build-arch-package@v1
        with:
          PKGBUILD: dkms/PKGBUILD

      - name: Move Arch Package
        run: |
          if compgen -G './*.pkg.tar.zst' >/dev/null; then
            mv ./*.pkg.tar.zst dist/
          else
            echo "Warning: No Arch package found" >&2
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  release:
    needs: build-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: mt76-mt7925-dkms
          pkgbuild: dkms/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
