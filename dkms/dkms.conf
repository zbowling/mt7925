# MT76 MT7925/MT7921 DKMS Configuration
# Builds patched MT7925 and MT7921 WiFi driver modules
#
# MT7921 is included because mt792x-lib is shared between both drivers.
# Building only mt7925 would cause ABI mismatch for mt7921 users.

PACKAGE_NAME="mt76-mt7925"
PACKAGE_VERSION="1.5.0"
AUTOINSTALL="yes"

# Only build on kernel 6.17+ (uses APIs not available in older kernels)
BUILD_EXCLUSIVE_KERNEL="^(6\.(1[7-9]|[2-9][0-9])|([7-9]|[1-9][0-9]+)\.).*"

# Build configuration
# Detect clang-built kernels and use LLVM toolchain
# Check if kernel config has CONFIG_CC_IS_CLANG=y
MAKE[0]="LLVM_FLAGS=''; if grep -q 'CONFIG_CC_IS_CLANG=y' ${kernel_source_dir}/.config 2>/dev/null; then LLVM_FLAGS='CC=clang LD=ld.lld LLVM=1'; fi; make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src \$LLVM_FLAGS modules"
# CLEAN is deprecated in DKMS 3.x - DKMS handles cleanup automatically

# Module 0: mt76 core
BUILT_MODULE_NAME[0]="mt76"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Module 1: mt76-connac-lib
BUILT_MODULE_NAME[1]="mt76-connac-lib"
BUILT_MODULE_LOCATION[1]="src"
DEST_MODULE_LOCATION[1]="/updates/dkms"

# Module 2: mt792x-lib (shared between mt7921 and mt7925)
BUILT_MODULE_NAME[2]="mt792x-lib"
BUILT_MODULE_LOCATION[2]="src"
DEST_MODULE_LOCATION[2]="/updates/dkms"

# Module 3: mt76-usb transport
BUILT_MODULE_NAME[3]="mt76-usb"
BUILT_MODULE_LOCATION[3]="src"
DEST_MODULE_LOCATION[3]="/updates/dkms"

# Module 4: mt792x-usb helpers
BUILT_MODULE_NAME[4]="mt792x-usb"
BUILT_MODULE_LOCATION[4]="src"
DEST_MODULE_LOCATION[4]="/updates/dkms"

# Module 5: mt76-sdio transport
BUILT_MODULE_NAME[5]="mt76-sdio"
BUILT_MODULE_LOCATION[5]="src"
DEST_MODULE_LOCATION[5]="/updates/dkms"

# ============================================================
# MT7921 modules (for ABI compatibility with mt792x-lib)
# ============================================================

# Module 6: mt7921-common
BUILT_MODULE_NAME[6]="mt7921-common"
BUILT_MODULE_LOCATION[6]="src"
DEST_MODULE_LOCATION[6]="/updates/dkms"

# Module 7: mt7921e PCIe
BUILT_MODULE_NAME[7]="mt7921e"
BUILT_MODULE_LOCATION[7]="src"
DEST_MODULE_LOCATION[7]="/updates/dkms"

# Module 8: mt7921s SDIO
BUILT_MODULE_NAME[8]="mt7921s"
BUILT_MODULE_LOCATION[8]="src"
DEST_MODULE_LOCATION[8]="/updates/dkms"

# Module 9: mt7921u USB
BUILT_MODULE_NAME[9]="mt7921u"
BUILT_MODULE_LOCATION[9]="src"
DEST_MODULE_LOCATION[9]="/updates/dkms"

# ============================================================
# MT7925 modules
# ============================================================

# Module 10: mt7925-common
BUILT_MODULE_NAME[10]="mt7925-common"
BUILT_MODULE_LOCATION[10]="src"
DEST_MODULE_LOCATION[10]="/updates/dkms"

# Module 11: mt7925e PCIe
BUILT_MODULE_NAME[11]="mt7925e"
BUILT_MODULE_LOCATION[11]="src"
DEST_MODULE_LOCATION[11]="/updates/dkms"
