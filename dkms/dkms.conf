# MT76 MT7925 DKMS Configuration
# Builds patched MT7925 WiFi driver modules

PACKAGE_NAME="mt76-mt7925"
PACKAGE_VERSION="1.0.0"
AUTOINSTALL="yes"

# Build configuration
# The Makefile auto-detects clang-built kernels and uses appropriate toolchain
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src clean"

# Module 0: mt76 core
BUILT_MODULE_NAME[0]="mt76"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Module 1: mt76-connac-lib
BUILT_MODULE_NAME[1]="mt76-connac-lib"
BUILT_MODULE_LOCATION[1]="src"
DEST_MODULE_LOCATION[1]="/updates/dkms"

# Module 2: mt792x-lib
BUILT_MODULE_NAME[2]="mt792x-lib"
BUILT_MODULE_LOCATION[2]="src"
DEST_MODULE_LOCATION[2]="/updates/dkms"

# Module 3: mt7925-common (built at src root, not in mt7925 subdir)
BUILT_MODULE_NAME[3]="mt7925-common"
BUILT_MODULE_LOCATION[3]="src"
DEST_MODULE_LOCATION[3]="/updates/dkms"

# Module 4: mt7925e PCIe (built at src root, not in mt7925 subdir)
BUILT_MODULE_NAME[4]="mt7925e"
BUILT_MODULE_LOCATION[4]="src"
DEST_MODULE_LOCATION[4]="/updates/dkms"
