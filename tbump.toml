# tbump configuration for mt7925
#
# Usage:
#   uvx tbump 1.5.0                    # Interactive mode (recommended)
#   uvx tbump 1.5.0 --non-interactive  # CI/automated mode
#   uvx tbump --only-patch 1.5.0       # Update files only, no git operations
#
# What happens when you run tbump:
#   1. Updates version in all [[file]] entries
#   2. Runs [[before_commit]] hooks (updates changelogs)
#   3. Creates git commit with message_template
#   4. Creates git tag with tag_template
#   5. Does NOT push (push = false) - you create a PR manually
#
# Install: pip install tbump (or use uvx for one-shot runs)

[version]
current = "1.4.2"

# Version format - semantic versioning (major.minor.patch)
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
'''

[git]
message_template = "chore: bump version to {new_version}"
tag_template = "v{new_version}"

# =============================================================================
# Before Commit Hooks
# Run after files are updated but before git commit
# =============================================================================

[[before_commit]]
name = "Update changelogs"
cmd = "./scripts/update-changelogs.sh {new_version} {current_version} 'Version bump'"

# =============================================================================
# DKMS Package Files
# =============================================================================

[[file]]
src = "dkms/dkms.conf"
search = 'PACKAGE_VERSION="{current_version}"'

[[file]]
src = "dkms/install.sh"
search = 'PACKAGE_VERSION="{current_version}"'

[[file]]
src = "dkms/uninstall.sh"
search = 'PACKAGE_VERSION="{current_version}"'

[[file]]
src = "dkms/PKGBUILD"
search = "pkgver={current_version}"

[[file]]
src = "dkms/mt76-mt7925-dkms.install"
search = '_dkms_ver="{current_version}"'

[[file]]
src = "dkms/mt76-mt7925-dkms.spec"
search = "%define version {current_version}"

# =============================================================================
# Documentation Files
# =============================================================================

[[file]]
src = "README.md"
search = "v{current_version}"

[[file]]
src = "docs/index.md"
search = "v{current_version}"

[[file]]
src = "docs/telemetry.md"
search = "{current_version}"

[[file]]
src = "docs/installation/index.md"
search = "{current_version}"

[[file]]
src = "docs/installation/manual.md"
search = "mt76-mt7925/{current_version}"

[[file]]
src = "docs/developer/index.md"
search = "mt76-mt7925/{current_version}"

# =============================================================================
# Changelog - update the "Unreleased" comparison link
# The before_commit hook handles adding new sections and version links
# =============================================================================

[[file]]
src = "CHANGELOG.md"
search = "compare/v{current_version}...HEAD"
